# Sema · Symptom Taxonomy
#
# Closed vocabulary that Gemma's NLU step (or in v1, Gemma itself acting
# as NLU) must map user descriptions onto. Free-form symptom strings
# never reach the triage engine — they are normalized to one of these
# slugs first.
#
# Why a closed vocabulary
# -----------------------
# 1. Triage rules fire on slugs, not prose. Determinism is the safety net.
# 2. Auditable: a clinician reviewing a case sees structured slugs, not
#    a hallucinated free-text label.
# 3. Cross-language: the slug is language-agnostic. Twi/Ga input maps
#    onto the same slug English input does, so the rules engine is
#    untouched by routing.
#
# Schema
# ------
# id              kebab-case slug. Stable.
# label           short English label (UI / fallback chat string).
# category        body system / class — drives chat picker UI grouping:
#                   bleeding | breathing | circulation | consciousness |
#                   gi | musculoskeletal | neuro | pain | skin |
#                   temperature | trauma | sensory | toxic | allergic |
#                   psychological | obstetric
# aliases         alternative phrasings users might say. Used by
#                 keyword-matching extractor (v1 fallback when Gemma is
#                 unavailable) and by the NLU model's training data.
# severity_hint   in-isolation worry level: low | medium | high | emergency
#                 - low      common, usually self-limiting
#                 - medium   monitor, may need clinic
#                 - high     usually needs medical attention
#                 - emergency call services on detection
# age_groups      where this symptom is meaningful: infant | child | adult
# requires_vital  measurement that must accompany this symptom for the
#                 triage engine to score it (e.g. fever needs body_temp).
# related_entries first_aid.yaml ids that handle this symptom.
# is_red_flag     true if this slug is also a red-flag predicate
#                 referenced from first_aid.yaml's `red_flags:` arrays.
#                 (We allow a symptom and a red flag to share a slug —
#                 the rule engine treats them the same.)

