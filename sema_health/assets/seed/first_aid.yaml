      - swelling-of-lips-or-tongue
      - difficulty-breathing
      - rash-with-blisters-or-peeling-skin
    steps:
      - { order: 1, action: "If the trigger is a plant (poison ivy/oak), wash the skin immediately with soap and water to remove the plant oils." }
      - { order: 2, action: "Apply a cool, damp cloth to the itchy area." }
      - { order: 3, action: "Use an over-the-counter anti-itch cream as directed." }
      - { order: 4, action: "An oral antihistamine can help if the itch is widespread or allergy-related." }
    donts:
      - "Do not scratch — broken skin invites bacterial infection."
    medications:
      - { name: "Hydrocortisone cream", role: otc-anti-itch }
      - { name: "Calamine lotion", role: otc-anti-itch }
      - { name: "Diphenhydramine (Benadryl)", role: otc-antihistamine }
    contraindications: []
