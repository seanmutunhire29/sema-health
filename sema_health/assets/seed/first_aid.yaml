# Sema · First-Aid Knowledge Graph
#
# Source corpus: Knowledge Graph/First Aid.txt (Sema in-house draft).
# This file is intentionally clinician-reviewable: every emergency entry
# must have `reviewed_by` and `references` populated before any release
# tag. CI guards on `severity: emergency` + `reviewed_by: pending`.
#
# Schema
# ------
# id              kebab-case unique slug; stable identifier used by
#                 lookup_first_aid(id) tool and conversation persistence.
# title           short human label (UI tile + chat heading).
# severity        low | medium | high | emergency
#                 - low       household self-care
#                 - medium    monitor; escalate if red-flag fires
#                 - high      needs medical attention soon
#                 - emergency call services / go to hospital now
# age_groups      who this entry applies to: infant (<1y) | child (1-12) | adult
# symptom_slugs   closed-vocabulary slugs Gemma must extract onto.
#                 Source of truth for the taxonomy lives in symptoms.yaml.
# red_flags       conditions that escalate this entry to emergency
#                 regardless of base severity. Triage rules engine reads
#                 these directly.
# steps           ordered actions. `critical: true` means "do not skip,
#                 do not reorder" — UI surfaces these with a red dot.
# donts           explicit anti-actions (the source text's "Do NOT"
#                 lines). Surfaced verbatim, never paraphrased by the LLM.
# medications     named drugs / devices the entry recommends. Whitelist:
#                 the safety guard allows Gemma to mention a drug only
#                 if the matched first-aid entry lists it here.
#                 - role: otc-pain-relief | otc-antihistamine |
#                         otc-anti-itch | rx-emergency-device
#                 - pediatric_contraindication: true if drug must NOT
#                   be given to children (e.g. Aspirin / Reye's).
# contraindications  profile-level blockers — the triage engine refuses
#                    to surface this entry if any contraindication matches
#                    the active profile (e.g. pregnancy + a drug).
# notes           free-form clinician note shown beneath the steps.
#                 NOT used as Gemma context — only the structured fields
#                 reach the prompt, so the LLM cannot improvise on prose.
# references      WHO / Red Cross / ministry-of-health citations. CI
#                 fails the build if an `emergency` entry has [].
# reviewed_by     "pending" | clinician identifier
# reviewed_on     ISO date | null
# escalation      what the chat agent must do when this entry fires
#                 with red_flag matched — `call_emergency`, `go_to_er`,
#                 `nearest_clinic`, `self_care`.

