  # ---------------------------------------------------------------- #
  # 9. Anaphylaxis — severe allergic reaction
  # ---------------------------------------------------------------- #
  - id: anaphylaxis
    title: Severe allergic reaction (anaphylaxis)
    severity: emergency
    age_groups: [infant, child, adult]
    symptom_slugs: [swelling-lips, swelling-tongue, hives, breathing-difficulty, allergic-reaction-severe, throat-tightness]
    red_flags:
      - airway-closing
      - swelling-of-lips-or-tongue
      - widespread-hives-with-breathing-difficulty
      - loss-of-consciousness
    steps:
      - { order: 1, action: "Call emergency services immediately.", critical: true }
      - { order: 2, action: "If the person has an epinephrine autoinjector (EpiPen), help them use it. Inject into the outer mid-thigh.", critical: true }
      - { order: 3, action: "Have the person lie flat on their back with their feet raised.", critical: true }
      - { order: 4, action: "If they are vomiting or having trouble breathing, let them sit up instead." }
      - { order: 5, action: "If symptoms do not improve and help is more than 5–10 minutes away, a second injection may be needed." }
    donts:
      - "Do not give food or drink — the airway can close."
      - "Do not delay the EpiPen waiting to 'see if it gets worse'."
    medications:
      - { name: "Epinephrine (EpiPen)", role: rx-emergency-device }
    contraindications: []
    notes: "Anaphylaxis can recur 4–12 hours after the first reaction. Hospital observation is required even if the EpiPen worked."
    references: []
    reviewed_by: pending
    reviewed_on: null
    escalation: call_emergency

  # ---------------------------------------------------------------- #
  # 10. Snake bites
  # ---------------------------------------------------------------- #
  - id: snake-bite
    title: Snake bite
    severity: emergency
    age_groups: [infant, child, adult]
    symptom_slugs: [snake-bite, animal-bite, venom-exposure]
    red_flags:
      - rapidly-spreading-swelling
      - difficulty-breathing
      - drooping-eyelids-or-blurred-vision
      - bleeding-from-gums-or-bite-site
    steps:
      - { order: 1, action: "Move away from the snake's striking distance — but do not chase it." }
      - { order: 2, action: "Keep the patient still and as calm as possible — a low heart rate slows the venom.", critical: true }
      - { order: 3, action: "Keep the bitten limb below the level of the heart." }
      - { order: 4, action: "Remove rings, watches, and tight clothing before the limb swells." }
      - { order: 5, action: "Wash the bite gently with soap and water and cover with a clean, dry dressing." }
      - { order: 6, action: "Get to the nearest hospital with antivenom capability — do not wait for symptoms.", critical: true }
    donts:
      - "Do not apply a tourniquet."
      - "Do not cut the wound or try to suck out the venom."
      - "Do not apply ice."
      - "Do not try to catch or kill the snake — a phone photo from a safe distance is enough for identification."
    medications: []
    contraindications: []
    notes: "Note the time of the bite. Antivenom works best within hours."
    references: []
    reviewed_by: pending
    reviewed_on: null
    escalation: call_emergency

