  # ---------------------------------------------------------------- #
  # 24. Splinters
  # ---------------------------------------------------------------- #
  - id: splinter
    title: Splinter
    severity: low
    age_groups: [child, adult]
    symptom_slugs: [splinter, foreign-body-skin]
    red_flags:
      - splinter-deep-or-near-eye
      - splinter-with-spreading-redness
      - splinter-from-rusty-metal
    steps:
      - { order: 1, action: "Wash your hands and the area with soap and water." }
      - { order: 2, action: "Sterilize a pair of tweezers with rubbing alcohol." }
      - { order: 3, action: "Grasp the end of the splinter and pull it out at the same angle it entered." }
      - { order: 4, action: "If the splinter is fully under the skin, sterilize a needle and gently nick the skin over the end of the splinter to lift it out." }
      - { order: 5, action: "Apply antibiotic ointment after removal." }
    donts:
      - "Do not squeeze the area — it pushes the splinter deeper."
    medications:
      - { name: "Antibiotic ointment", role: otc-topical }
    contraindications: []
    notes: "If the splinter is from rusty metal and the patient's tetanus shot is more than 5 years old, see a clinician for a booster."
    references: []
    reviewed_by: pending
    reviewed_on: null
    escalation: self_care

  # ---------------------------------------------------------------- #
  # 25. Friction blisters
  # ---------------------------------------------------------------- #
  - id: blister-friction
    title: Friction blister
    severity: low
    age_groups: [child, adult]
    symptom_slugs: [blister, friction-injury]
    red_flags:
      - blister-from-burn
      - blister-with-spreading-redness
      - blister-with-fever
    steps:
      - { order: 1, action: "Leave intact blisters alone — the unbroken skin is a sterile bandage." }
      - { order: 2, action: "Cover loosely with a bandage or a 'donut' of moleskin." }
      - { order: 3, action: "If the blister breaks, clean with mild soap and water, apply antibiotic ointment, and cover with a bandage." }
    donts:
      - "Do not pop a healthy blister — you remove the skin's own protection."
    medications:
      - { name: "Antibiotic ointment", role: otc-topical }
    contraindications: []
    notes: "Burn blisters and friction blisters are different — see Burns (minor) for the burn case."
    references: []
    reviewed_by: pending
    reviewed_on: null
    escalation: self_care

