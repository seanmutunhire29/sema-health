      - { order: 2, action: "Turn off the power at the breaker or unplug the device. If you cannot, push the person away with a non-conducting object (e.g. a wooden broom handle)." }
      - { order: 3, action: "Once safe, check for breathing. If they are not breathing, start CPR and call emergency services." }
      - { order: 4, action: "Even if the person looks fine, internal damage can occur — they should be seen by a doctor.", critical: true }
    donts:
      - "Do not approach a high-voltage source (downed power line, industrial line) — call emergency services and keep bystanders 10 m back."
    medications: []
    contraindications: []
    notes: "Electrical burns often look small on the skin but can hide deep tissue and cardiac damage."
    references: []
    reviewed_by: pending
    reviewed_on: null
    escalation: call_emergency

  # ---------------------------------------------------------------- #
  # 20. Knocked-out tooth
  # ---------------------------------------------------------------- #
  - id: knocked-out-tooth
    title: Knocked-out tooth
    severity: high
    age_groups: [child, adult]
    symptom_slugs: [knocked-out-tooth, dental-trauma, tooth-injury]
    red_flags:
      - heavy-bleeding-from-mouth
      - jaw-pain-or-misalignment
      - head-injury
    steps:
      - { order: 1, action: "Pick the tooth up by the crown (chewing part). Do not touch the root." }
      - { order: 2, action: "If dirty, rinse gently with water — do not scrub." }
      - { order: 3, action: "If possible, place the tooth back in the socket and have the person bite gently on gauze." }
      - { order: 4, action: "If you cannot reinsert it, store it in a small container of milk, or in the person's own saliva." }
      - { order: 5, action: "See a dentist within 30 minutes for the best chance of saving the tooth.", critical: true }
    donts:
      - "Do not scrub the root or use soap on the tooth."
      - "Do not store the tooth dry."
    medications: []
    contraindications: []
    notes: "Baby teeth are usually not reinserted — see a dentist regardless."
    references: []
    reviewed_by: pending
    reviewed_on: null
    escalation: nearest_clinic

  # ---------------------------------------------------------------- #
  # 21. Broken limbs (fractures)
  # ---------------------------------------------------------------- #
  - id: broken-limb
    title: Broken limb (suspected fracture)
    severity: high
    age_groups: [infant, child, adult]
    symptom_slugs: [fracture, broken-bone, deformed-limb, severe-limb-pain]
    red_flags:
      - bone-visible-through-skin
      - limb-cold-blue-or-numb
      - heavy-bleeding-at-the-fracture
      - injury-from-fall-from-height
      - injury-to-spine-or-head
    steps:
      - { order: 1, action: "Stop any bleeding with pressure and a clean cloth." }
      - { order: 2, action: "Immobilize the area with a splint (folded cardboard, a heavy stick, or a rolled-up magazine). Keep the joints above and below the break still.", critical: true }
      - { order: 3, action: "Wrap ice in a cloth and apply to reduce swelling and pain." }
      - { order: 4, action: "Treat for shock: have the person lie down and keep them warm with a blanket." }
      - { order: 5, action: "Get to a hospital — every suspected fracture needs an X-ray.", critical: true }
    donts:
      - "Do not try to push a bone back into the skin or 'straighten' the limb."
      - "Do not give food or drink in case surgery is needed."
    medications: []
    contraindications: []
    notes: "Open (compound) fractures with bone showing are an emergency — call services."
    references: []
    reviewed_by: pending
    reviewed_on: null
    escalation: nearest_clinic

  # ---------------------------------------------------------------- #
  # 22. Fever
  # ---------------------------------------------------------------- #
  - id: fever
    title: Fever
    severity: low
    age_groups: [infant, child, adult]
    symptom_slugs: [fever, high-temperature, chills, body-aches]
    red_flags:
      - infant-under-3-months-with-any-fever
      - adult-temperature-over-39-4c
      - fever-with-stiff-neck
      - fever-with-confusion
      - fever-with-rash
      - fever-longer-than-3-days
    steps:
      - { order: 1, action: "Encourage water, juice, or broth to keep hydrated.", critical: true }
      - { order: 2, action: "Use light clothing — piling on blankets traps heat and raises temperature." }
      - { order: 3, action: "Use over-the-counter fever medication as directed." }
      - { order: 4, action: "A lukewarm sponge bath can help. Stop if the person starts to shiver — shivering raises body temperature." }
    donts:
      - "Do not give Aspirin to children or teenagers — it can cause Reye's syndrome."
      - "Do not give fever medication to an infant under 3 months without a clinician's instruction."
    medications:
      - { name: "Acetaminophen", role: otc-pain-relief }
      - { name: "Ibuprofen", role: otc-pain-relief }
      - { name: "Aspirin", role: otc-pain-relief, pediatric_contraindication: true }
    contraindications:
      - { profile: "age_lt_3_months", action: refuse_self_care, escalate_to: nearest_clinic }
    notes: "Any infant under 3 months with a measurable fever is an immediate clinic visit, full stop."
    references: []
    reviewed_by: pending
    reviewed_on: null
    escalation: self_care

