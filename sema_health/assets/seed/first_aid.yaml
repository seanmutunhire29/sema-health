  # ---------------------------------------------------------------- #
  # 3. Severe bleeding
  # ---------------------------------------------------------------- #
  - id: severe-bleeding
    title: Severe bleeding
    severity: emergency
    age_groups: [infant, child, adult]
    symptom_slugs: [severe-bleeding, heavy-bleeding, arterial-bleeding]
    red_flags:
