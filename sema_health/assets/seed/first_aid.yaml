      - patient-pale-cold-clammy
    steps:
      - { order: 1, action: "Call emergency services immediately.", critical: true }
      - { order: 2, action: "Push down hard on the wound with both hands using a clean cloth.", critical: true }
      - { order: 3, action: "If a limb is bleeding heavily and direct pressure is not working, apply a tourniquet 2–3 inches above the wound (between the wound and the heart)." }
      - { order: 4, action: "Note the time the tourniquet was applied — tell the medics." }
    donts:
      - "Do not lift the cloth to check if the bleeding has stopped — keep pressure on."
      - "Do not apply a tourniquet on the neck, head, or torso."
    medications: []
    contraindications: []
    notes: "Tourniquet is a last resort for limb bleeding only. Direct pressure first."
    references: []
    reviewed_by: pending
    reviewed_on: null
    escalation: call_emergency

