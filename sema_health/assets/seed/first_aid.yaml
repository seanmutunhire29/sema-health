  # 6. Choking — Heimlich (adults / children > 1 year)
  # ---------------------------------------------------------------- #
  - id: choking-adult-child
    title: Choking (adult / child)
    severity: emergency
    age_groups: [child, adult]
    symptom_slugs: [choking, airway-obstruction, cannot-breathe]
    red_flags:
      - cannot-cough-speak-or-breathe
      - patient-turning-blue
      - patient-loses-consciousness
    steps:
      - { order: 1, action: "If they can cough or speak, encourage them to keep coughing — do not interfere." }
      - { order: 2, action: "If they cannot breathe: stand behind them and wrap your arms around their waist.", critical: true }
      - { order: 3, action: "Make a fist. Place the thumb side just above the navel.", critical: true }
      - { order: 4, action: "Perform quick, upward-and-inward thrusts until the object is forced out.", critical: true }
      - { order: 5, action: "If they lose consciousness, lower them carefully and start CPR. Call emergency services." }
    donts:
      - "Do not use this technique on infants under 1 year — see Choking (infants)."
    medications: []
    contraindications:
      - { profile: pregnant, alternative: "Use chest thrusts instead of abdominal thrusts." }
    notes: "Continue thrusts until the object comes out or the person becomes unresponsive."
    references: []
    reviewed_by: pending
    reviewed_on: null
    escalation: call_emergency

  # ---------------------------------------------------------------- #
  # 7. Choking — infants < 1 year
  # ---------------------------------------------------------------- #
  - id: choking-infant
    title: Choking (infant under 1 year)
    severity: emergency
    age_groups: [infant]
    symptom_slugs: [choking-infant, airway-obstruction-infant]
    red_flags:
      - infant-cannot-cry-or-cough
      - infant-turning-blue
      - infant-loses-consciousness
    steps:
      - { order: 1, action: "Lay the baby face-down on your forearm, resting on your thigh. Support the jaw.", critical: true }
      - { order: 2, action: "Give 5 firm back blows between the shoulder blades with the heel of your hand.", critical: true }
      - { order: 3, action: "Turn the baby face-up.", critical: true }
      - { order: 4, action: "Place two fingers in the centre of the chest (just below the nipple line) and give 5 quick chest thrusts.", critical: true }
      - { order: 5, action: "Repeat the cycle until the object comes out or the baby starts crying." }
      - { order: 6, action: "If the baby loses consciousness, start infant CPR and call emergency services.", critical: true }
    donts:
      - "Do not use the adult Heimlich manoeuvre on a baby."
      - "Do not blindly sweep the mouth — you may push the object deeper."
    medications: []
    contraindications: []
    notes: "Five back blows + five chest thrusts is one cycle. Never stop until help arrives or the baby breathes."
    references: []
    reviewed_by: pending
    reviewed_on: null
    escalation: call_emergency

