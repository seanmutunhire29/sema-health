  # ---------------------------------------------------------------- #
  # 27. Hyperventilation (rapid breathing)
  # ---------------------------------------------------------------- #
  - id: hyperventilation
    title: Hyperventilation (rapid breathing)
    severity: low
    age_groups: [child, adult]
    symptom_slugs: [hyperventilation, rapid-breathing, panic-breathing, anxiety-breathing]
    red_flags:
      - chest-pain
      - blue-lips-or-fingertips
      - history-of-asthma
      - first-ever-episode
      - did-not-resolve-within-15-minutes
    steps:
      - { order: 1, action: "Stay calm. Reassure the person they are safe." }
      - { order: 2, action: "Breathe with them: slow, deep breaths — in through the nose, out through pursed lips (like blowing out a candle)." }
      - { order: 3, action: "Have them cup their hands over their mouth and nose and breathe into their hands." }
    donts:
      - "Do not use a paper bag — that is no longer the recommendation."
      - "Do not assume hyperventilation if the person has chest pain, blue lips, or a history of asthma — those need medical assessment."
    medications: []
    contraindications: []
    notes: "Asthma attacks and panic-driven hyperventilation look similar at first glance but need different treatment."
    references: []
    reviewed_by: pending
