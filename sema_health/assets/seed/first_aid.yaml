  # ---------------------------------------------------------------- #
  # 1. Dehydration & diarrhea — ORS recipe
  # ---------------------------------------------------------------- #
  - id: dehydration-diarrhea
    title: Dehydration & diarrhea
    severity: medium
    age_groups: [infant, child, adult]
    symptom_slugs: [diarrhea, dehydration, lethargy, dry-mouth]
    red_flags:
      - cannot-keep-fluids-down
      - extreme-lethargy
      - infant-fewer-than-six-wet-diapers-24h
    steps:
      - { order: 1, action: "Boil and cool 1 litre of clean water.", critical: true }
      - { order: 2, action: "Add 6 level teaspoons of sugar." }
      - { order: 3, action: "Add ½ level teaspoon of salt." }
      - { order: 4, action: "Stir until fully dissolved." }
      - { order: 5, action: "Sip slowly and frequently — do not gulp." }
    donts:
      - "Do not use more salt than the recipe — too much salt is dangerous, especially for children."
    medications: []
    contraindications: []
    notes: "If the patient cannot keep fluids down or shows signs of extreme lethargy, seek medical help immediately."
    references: []
    reviewed_by: pending
    reviewed_on: null
    escalation: nearest_clinic

